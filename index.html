<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFO 2 - Sistema de Gestión de Tareas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-gradient-1: #0f172a;
            --bg-gradient-2: #1e1b4b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2)); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            max-width: 700px; 
            width: 100%;
            background: var(--card-bg); 
            padding: 45px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            text-align: center;
        }
        h1 { 
            color: #ffffff; 
            font-size: 34px; 
            font-weight: 800;
            margin-bottom: 14px; 
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { 
            font-size: 16px; 
            color: var(--text-muted); 
            line-height: 1.7; 
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #4338ca;
        }
        .footer {
            margin-top: 40px; 
            font-size: 13px; 
            color: #64748b; 
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema de Gestión de Tareas</h1>
        <p>Proyecto Formativo Obligatorio 2 (PFO 2)<br>Desarrollado en Python con Flask, SQLite y autenticación segura.</p>
        
        <p>Alumno: <strong>Guillermo Miguel Sciulli</strong></p>
        
        <a href="https://github.com/guillote1977/PROG-Redes-PFO2" class="btn">Ver Código en GitHub</a>
        
        <div class="footer">
            Programación sobre Redes | IFTS N° 29
        </div>
    </div>
</body>
</html>
